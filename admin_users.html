{% extends 'base.html' %}{% block title %}Manage Users{% endblock %}{% block content %}<section class="app-wrap"><div class="page-heading"><div><span class="eyebrow">ADMINISTRATION</span><h1>Users</h1><p class="muted">Accounts registered in HomePulse.</p></div><a class="btn btn-outline" href="{{ url_for('admin_dashboard') }}">← Overview</a></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody>{% for u in users %}<tr><td><strong>{{ u.name }}</strong></td><td>{{ u.email }}</td><td><span class="status {{ 'status-resolved' if u.role=='admin' else 'status-pending' }}">{{ u.role|title }}</span></td><td>{{ u.created_at[:10] }}</td></tr>{% endfor %}</tbody></table></div></section></section>{% endblock %}
