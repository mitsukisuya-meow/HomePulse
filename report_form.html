{% extends 'base.html' %}{% block title %}Report a Concern{% endblock %}{% block content %}<section class="narrow-page"><a class="back-link" href="{{ url_for('dashboard') }}">← Dashboard</a><span class="eyebrow">HELP YOUR COMMUNITY</span><h1>Report a concern</h1><p class="muted">Share the details below so the right team can review your concern.</p><form method="post" class="panel form-panel form-stack" data-validate><label>Report title<input name="title" required maxlength="120" placeholder="Briefly describe the issue"></label><div class="form-row"><label>Category<select name="category" required><option value="">Choose a category</option><option>Roads & Infrastructure</option><option>Waste Management</option><option>Street Lighting</option><option>Water & Drainage</option><option>Public Safety</option><option>Parks & Public Spaces</option><option>Other</option></select></label><label>Location<input name="location" required maxlength="200" placeholder="Street, landmark, or area"></label></div><label>Description<textarea name="description" required minlength="10" rows="6" placeholder="Describe what happened, where it happened, and any details that may help..."></textarea><small class="muted">Please provide at least 10 characters.</small></label><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit">Submit report →</button></div></form></section>{% endblock %}
