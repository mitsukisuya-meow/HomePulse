{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block content %}<section class="narrow-page"><span class="eyebrow">YOUR ACCOUNT</span><h1>Profile settings</h1><p class="muted">Manage the personal details associated with your account.</p><form method="post" class="panel form-panel form-stack"><div class="profile-avatar">{{ user.name[:1]|upper }}</div><label>Full name<input name="name" required minlength="2" value="{{ user.name }}"></label><label>Email address<input type="email" value="{{ user.email }}" disabled><small class="muted">Email address cannot be changed here.</small></label><div class="form-actions"><button class="btn btn-primary" type="submit">Save changes</button></div></form></section>{% endblock %}
